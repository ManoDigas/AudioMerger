              private fun shareResult(
                  file: File
              ) {

                  val uri =
                      FileProvider.getUriForFile(
                          this,
                          "$packageName.fileprovider",
                          file
                      )

                  val shareIntent =
                      Intent(
                          Intent.ACTION_SEND
                      ).apply {

                          type =
                              "audio/mp4"

                          putExtra(
                              Intent.EXTRA_STREAM,
                              uri
                          )

                          addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )

                          clipData =
                              ClipData.newRawUri(
                                  "Áudio mesclado",
                                  uri
                              )
                      }

                  startActivity(
                      Intent.createChooser(
                          shareIntent,
                          "Enviar áudio mesclado"
                      )
                  )
              }
          }

          private fun formatTime(
              milliseconds: Long
          ): String {

              val seconds =
                  milliseconds
                      .coerceAtLeast(0L) /
                      1000L

              val hours =
                  seconds / 3600L

              val minutes =
                  (seconds % 3600L) /
                      60L

              val secs =
                  seconds % 60L

              return if (hours > 0L) {

                  String.format(
                      Locale.getDefault(),
                      "%d:%02d:%02d",
                      hours,
                      minutes,
                      secs
                  )

              } else {

                  String.format(
                      Locale.getDefault(),
                      "%02d:%02d",
                      minutes,
                      secs
                  )
              }
          }

