name: Build AudioMerger APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
          cache-disabled: true

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/example/audiomerger
          mkdir -p app/src/main/res/xml

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AudioMerger"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.audiomerger"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.audiomerger"
                  minSdk = 26
                  targetSdk = 34

                  versionCode = 3
                  versionName = "1.2"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              implementation("dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.7")

              // Necessário para o FFmpegKit no Android.
              implementation("com.arthenica:smart-exception-java:0.2.1")

              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="Mesclador de Áudio"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>

                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">

                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />

                  </provider>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path
                  name="cached_audio"
                  path="." />
          </paths>
          EOF

          cat > app/src/main/java/com/example/audiomerger/AudioMerger.kt <<'EOF'
          package com.example.audiomerger

          import android.content.Context
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.provider.OpenableColumns
          import com.arthenica.ffmpegkit.FFmpegKit
          import com.arthenica.ffmpegkit.ReturnCode
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import java.io.File
          import java.io.FileOutputStream
          import java.util.UUID
          import kotlin.coroutines.resume

          data class AudioItem(
              val id: String = UUID.randomUUID().toString(),
              val name: String,
              val file: File
          )

          data class MergeResult(
              val file: File? = null,
              val error: String? = null,
              val mode: String? = null
          )

          object AudioMerger {

              suspend fun copyUriToCache(
                  context: Context,
                  uri: Uri
              ): AudioItem? = withContext(Dispatchers.IO) {

                  try {

                      var displayName =
                          "audio_${System.currentTimeMillis()}.m4a"

                      context.contentResolver
                          .query(
                              uri,
                              arrayOf(OpenableColumns.DISPLAY_NAME),
                              null,
                              null,
                              null
                          )
                          ?.use { cursor ->

                              val index =
                                  cursor.getColumnIndex(
                                      OpenableColumns.DISPLAY_NAME
                                  )

                              if (
                                  index >= 0 &&
                                  cursor.moveToFirst()
                              ) {

                                  cursor.getString(index)?.let {
                                      displayName = it
                                  }
                              }
                          }

                      /*
                       * Também removemos aspas simples.
                       * Isso deixa o caminho seguro para o arquivo
                       * de concatenação usado no modo rápido.
                       */
                      val safeName =
                          displayName
                              .replace(
                                  Regex("[\\\\/:*?\"<>|'\\n\\r]"),
                                  "_"
                              )
                              .take(120)

                      val destination =
                          File(
                              context.cacheDir,
                              "input_${UUID.randomUUID()}_$safeName"
                          )

                      val input =
                          context.contentResolver
                              .openInputStream(uri)
                              ?: return@withContext null

                      input.use { source ->

                          FileOutputStream(destination)
                              .use { output ->

                                  source.copyTo(output)
                              }
                      }

                      if (
                          !destination.exists() ||
                          destination.length() <= 0L
                      ) {

                          destination.delete()

                          return@withContext null
                      }

                      AudioItem(
                          name = displayName,
                          file = destination
                      )

                  } catch (e: Exception) {

                      null
                  }
              }

              /*
               * Tenta descobrir a duração pelo Android.
               * Isso é usado somente para calcular a porcentagem.
               *
               * Se algum arquivo não revelar sua duração,
               * a mesclagem continua funcionando normalmente.
               */
              private fun getDurationMs(
                  file: File
              ): Long? {

                  val retriever =
                      MediaMetadataRetriever()

                  return try {

                      retriever.setDataSource(
                          file.absolutePath
                      )

                      retriever.extractMetadata(
                          MediaMetadataRetriever
                              .METADATA_KEY_DURATION
                      )?.toLongOrNull()

                  } catch (e: Exception) {

                      null

                  } finally {

                      try {
                          retriever.release()
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun getTotalDurationMs(
                  audioList: List<AudioItem>
              ): Long? {

                  var total = 0L

                  audioList.forEach { item ->

                      val duration =
                          getDurationMs(item.file)
                              ?: return null

                      total += duration
                  }

                  return if (total > 0L) {
                      total
                  } else {
                      null
                  }
              }

              /*
               * Executa o FFmpeg de forma assíncrona.
               *
               * O callback de estatísticas informa quantos
               * milissegundos já foram processados.
               */
              private suspend fun executeFFmpeg(
                  arguments: Array<String>,
                  totalDurationMs: Long?,
                  progressStart: Float,
                  progressEnd: Float,
                  phase: String,
                  onProgress: (
                      progress: Float?,
                      processedMs: Long,
                      totalMs: Long?,
                      phase: String
                  ) -> Unit
              ) = suspendCancellableCoroutine { continuation ->

                  var completed = false

                  val session =
                      FFmpegKit.executeWithArgumentsAsync(
                          arguments,

                          { finishedSession ->

                              if (!completed) {

                                  completed = true

                                  continuation.resume(
                                      finishedSession
                                  )
                              }
                          },

                          null,

                          { statistics ->

                              val processedMs =
                                  statistics.time
                                      .coerceAtLeast(0L)

                              val progress =
                                  if (
                                      totalDurationMs != null &&
                                      totalDurationMs > 0L
                                  ) {

                                      val local =
                                          (
                                              processedMs.toFloat() /
                                              totalDurationMs.toFloat()
                                          ).coerceIn(
                                              0f,
                                              1f
                                          )

                                      progressStart +
                                          (
                                              progressEnd -
                                              progressStart
                                          ) * local

                                  } else {

                                      null
                                  }

                              onProgress(
                                  progress,
                                  processedMs,
                                  totalDurationMs,
                                  phase
                              )
                          }
                      )

                  continuation.invokeOnCancellation {

                      try {
                          FFmpegKit.cancel(
                              session.sessionId
                          )
                      } catch (_: Exception) {
                      }
                  }
              }

              /*
               * MODO RÁPIDO
               *
               * Tenta concatenar os arquivos sem recodificar.
               * Quando funciona, normalmente termina muito
               * mais rápido porque não precisa decodificar
               * e codificar novamente todo o áudio.
               */
              private suspend fun tryFastMerge(
                  context: Context,
                  audioList: List<AudioItem>,
                  outputFile: File,
                  totalDurationMs: Long?,
                  onProgress: (
                      Float?,
                      Long,
                      Long?,
                      String
                  ) -> Unit
              ): Boolean {

                  val concatFile =
                      File(
                          context.cacheDir,
                          "concat_${UUID.randomUUID()}.txt"
                      )

                  try {

                      concatFile.bufferedWriter()
                          .use { writer ->

                              audioList.forEach { item ->

                                  writer.append(
                                      "file '${item.file.absolutePath}'"
                                  )

                                  writer.newLine()
                              }
                          }

                      onProgress(
                          0.02f,
                          0L,
                          totalDurationMs,
                          "Tentando mesclagem rápida..."
                      )

                      val arguments =
                          arrayOf(
                              "-hide_banner",

                              "-f",
                              "concat",

                              "-safe",
                              "0",

                              "-i",
                              concatFile.absolutePath,

                              "-vn",

                              "-c:a",
                              "copy",

                              "-movflags",
                              "+faststart",

                              "-y",

                              outputFile.absolutePath
                          )

                      val session =
                          executeFFmpeg(
                              arguments =
                                  arguments,

                              totalDurationMs =
                                  totalDurationMs,

                              progressStart =
                                  0.02f,

                              progressEnd =
                                  0.90f,

                              phase =
                                  "Mesclagem rápida...",

                              onProgress =
                                  onProgress
                          )

                      return (
                          ReturnCode.isSuccess(
                              session.returnCode
                          ) &&
                          outputFile.exists() &&
                          outputFile.length() > 0L
                      )

                  } catch (_: Throwable) {

                      return false

                  } finally {

                      concatFile.delete()
                  }
              }

              /*
               * MODO COMPATÍVEL
               *
               * É o método mais pesado, porém aceita arquivos
               * com configurações diferentes.
               *
               * Todos são convertidos para:
               * AAC / 44.1 kHz / estéreo.
               */
              private suspend fun compatibleMerge(
                  audioList: List<AudioItem>,
                  outputFile: File,
                  totalDurationMs: Long?,
                  onProgress: (
                      Float?,
                      Long,
                      Long?,
                      String
                  ) -> Unit
              ): MergeResult {

                  val arguments =
                      mutableListOf<String>()

                  arguments += "-hide_banner"

                  audioList.forEach { item ->

                      arguments += "-i"
                      arguments += item.file.absolutePath
                  }

                  val filterBuilder =
                      StringBuilder()

                  audioList.indices.forEach { index ->

                      filterBuilder.append(
                          "[$index:a]" +
                              "aresample=44100," +
                              "aformat=" +
                              "sample_fmts=fltp:" +
                              "sample_rates=44100:" +
                              "channel_layouts=stereo" +
                              "[a$index];"
                      )
                  }

                  audioList.indices.forEach { index ->

                      filterBuilder.append(
                          "[a$index]"
                      )
                  }

                  filterBuilder.append(
                      "concat=n=${audioList.size}:" +
                          "v=0:a=1[outa]"
                  )

                  arguments += "-filter_complex"
                  arguments += filterBuilder.toString()

                  arguments += "-map"
                  arguments += "[outa]"

                  arguments += "-vn"

                  arguments += "-c:a"
                  arguments += "aac"

                  /*
                   * 160 kbps é mais leve que 192 kbps
                   * e continua sendo uma qualidade alta
                   * para notas de voz e gravações.
                   */
                  arguments += "-b:a"
                  arguments += "160k"

                  arguments += "-ar"
                  arguments += "44100"

                  arguments += "-ac"
                  arguments += "2"

                  arguments += "-movflags"
                  arguments += "+faststart"

                  arguments += "-y"

                  arguments += outputFile.absolutePath

                  onProgress(
                      0f,
                      0L,
                      totalDurationMs,
                      "Convertendo áudios..."
                  )

                  val session =
                      executeFFmpeg(
                          arguments =
                              arguments.toTypedArray(),

                          totalDurationMs =
                              totalDurationMs,

                          progressStart =
                              0f,

                          progressEnd =
                              0.98f,

                          phase =
                              "Convertendo e mesclando...",

                          onProgress =
                              onProgress
                      )

                  if (
                      ReturnCode.isSuccess(
                          session.returnCode
                      ) &&
                      outputFile.exists() &&
                      outputFile.length() > 0L
                  ) {

                      onProgress(
                          1f,
                          totalDurationMs ?: 0L,
                          totalDurationMs,
                          "Concluído"
                      )

                      return MergeResult(
                          file = outputFile,
                          mode = "Compatível"
                      )
                  }

                  outputFile.delete()

                  val log =
                      try {

                          session.allLogsAsString
                              ?.takeLast(10000)
                              ?: "O FFmpeg não forneceu detalhes."

                      } catch (_: Exception) {

                          "Não foi possível recuperar o log."
                      }

                  return MergeResult(
                      error =
                          """
                          Falha ao processar os áudios.

                          Modo:
                          Compatível

                          Código do FFmpeg:
                          ${session.returnCode}

                          Arquivos:
                          ${audioList.joinToString("\n") { "• ${it.name}" }}

                          ----- LOG DO FFMPEG -----

                          $log
                          """.trimIndent()
                  )
              }

              suspend fun mergeAudios(
                  context: Context,
                  audioList: List<AudioItem>,
                  onProgress: (
                      progress: Float?,
                      processedMs: Long,
                      totalMs: Long?,
                      phase: String
                  ) -> Unit
              ): MergeResult = withContext(
                  Dispatchers.IO
              ) {

                  if (audioList.isEmpty()) {

                      return@withContext MergeResult(
                          error =
                              "Nenhum áudio foi adicionado."
                      )
                  }

                  val missing =
                      audioList.filter {
                          !it.file.exists() ||
                              it.file.length() <= 0L
                      }

                  if (missing.isNotEmpty()) {

                      return@withContext MergeResult(
                          error =
                              "Alguns arquivos não estão mais " +
                                  "disponíveis:\n\n" +
                                  missing.joinToString("\n") {
                                      "• ${it.name}"
                                  }
                      )
                  }

                  val totalDurationMs =
                      getTotalDurationMs(
                          audioList
                      )

                  val outputFile =
                      File(
                          context.cacheDir,
                          "Nota_Mesclada_" +
                              "${System.currentTimeMillis()}.m4a"
                      )

                  try {

                      outputFile.delete()

                      /*
                       * Primeiro tentamos o modo rápido.
                       */
                      val fastSuccess =
                          tryFastMerge(
                              context =
                                  context,

                              audioList =
                                  audioList,

                              outputFile =
                                  outputFile,

                              totalDurationMs =
                                  totalDurationMs,

                              onProgress =
                                  onProgress
                          )

                      if (
                          fastSuccess &&
                          outputFile.exists() &&
                          outputFile.length() > 0L
                      ) {

                          onProgress(
                              1f,
                              totalDurationMs ?: 0L,
                              totalDurationMs,
                              "Concluído rapidamente"
                          )

                          return@withContext MergeResult(
                              file = outputFile,
                              mode = "Rápido"
                          )
                      }

                      /*
                       * Os arquivos não eram compatíveis com
                       * cópia direta. Apaga a tentativa parcial
                       * e usa a forma segura.
                       */
                      outputFile.delete()

                      onProgress(
                          0f,
                          0L,
                          totalDurationMs,
                          "Modo rápido incompatível. " +
                              "Usando modo compatível..."
                      )

                      return@withContext compatibleMerge(
                          audioList =
                              audioList,

                          outputFile =
                              outputFile,

                          totalDurationMs =
                              totalDurationMs,

                          onProgress =
                              onProgress
                      )

                  } catch (e: Throwable) {

                      outputFile.delete()

                      return@withContext MergeResult(
                          error =
                              """
                              Ocorreu um erro inesperado durante a mesclagem.

                              Tipo:
                              ${e.javaClass.simpleName}

                              Mensagem:
                              ${e.message ?: "Sem mensagem de erro."}

                              Arquivos:
                              ${audioList.joinToString("\n") { "• ${it.name}" }}
                              """.trimIndent()
                      )
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/audiomerger/AudioViewModel.kt <<'EOF'
          package com.example.audiomerger

          import android.app.Application
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import java.io.File

          class AudioViewModel(
              application: Application
          ) : AndroidViewModel(application) {

              private val _audioQueue =
                  MutableStateFlow<List<AudioItem>>(
                      emptyList()
                  )

              val audioQueue:
                  StateFlow<List<AudioItem>> =
                  _audioQueue.asStateFlow()

              private val _isProcessing =
                  MutableStateFlow(false)

              val isProcessing:
                  StateFlow<Boolean> =
                  _isProcessing.asStateFlow()

              /*
               * null significa que não conseguimos calcular
               * uma porcentagem exata.
               */
              private val _progress =
                  MutableStateFlow<Float?>(null)

              val progress:
                  StateFlow<Float?> =
                  _progress.asStateFlow()

              private val _processedMs =
                  MutableStateFlow(0L)

              val processedMs:
                  StateFlow<Long> =
                  _processedMs.asStateFlow()

              private val _totalMs =
                  MutableStateFlow<Long?>(null)

              val totalMs:
                  StateFlow<Long?> =
                  _totalMs.asStateFlow()

              private val _phase =
                  MutableStateFlow("")

              val phase:
                  StateFlow<String> =
                  _phase.asStateFlow()

              private val _lastMode =
                  MutableStateFlow<String?>(null)

              val lastMode:
                  StateFlow<String?> =
                  _lastMode.asStateFlow()

              private val _errorMessage =
                  MutableStateFlow<String?>(null)

              val errorMessage:
                  StateFlow<String?> =
                  _errorMessage.asStateFlow()

              private val _errorDetails =
                  MutableStateFlow<String?>(null)

              val errorDetails:
                  StateFlow<String?> =
                  _errorDetails.asStateFlow()

              fun handleIncomingIntent(
                  intent: Intent?
              ) {

                  if (intent == null) {
                      return
                  }

                  when (intent.action) {

                      Intent.ACTION_SEND -> {

                          getSingleUri(intent)?.let {
                              addUri(it)
                          }
                      }

                      Intent.ACTION_SEND_MULTIPLE -> {

                          getMultipleUris(intent)
                              .forEach {
                                  addUri(it)
                              }
                      }
                  }
              }

              private fun addUri(
                  uri: Uri
              ) {

                  viewModelScope.launch {

                      val context =
                          getApplication<Application>()
                              .applicationContext

                      val item =
                          AudioMerger.copyUriToCache(
                              context,
                              uri
                          )

                      if (item != null) {

                          _audioQueue.value =
                              _audioQueue.value + item

                      } else {

                          _errorMessage.value =
                              "Não foi possível abrir " +
                                  "um dos áudios."
                      }
                  }
              }

              private fun getSingleUri(
                  intent: Intent
              ): Uri? {

                  return if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU
                  ) {

                      intent.getParcelableExtra(
                          Intent.EXTRA_STREAM,
                          Uri::class.java
                      )

                  } else {

                      @Suppress("DEPRECATION")

                      intent.getParcelableExtra(
                          Intent.EXTRA_STREAM
                      )
                  }
              }

              private fun getMultipleUris(
                  intent: Intent
              ): List<Uri> {

                  return if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.TIRAMISU
                  ) {

                      intent.getParcelableArrayListExtra(
                          Intent.EXTRA_STREAM,
                          Uri::class.java
                      ) ?: emptyList()

                  } else {

                      @Suppress("DEPRECATION")

                      intent.getParcelableArrayListExtra<Uri>(
                          Intent.EXTRA_STREAM
                      ) ?: emptyList()
                  }
              }

              fun removeAudio(
                  item: AudioItem
              ) {

                  if (_isProcessing.value) {
                      return
                  }

                  _audioQueue.value =
                      _audioQueue.value.filter {
                          it.id != item.id
                      }

                  item.file.delete()
              }

              fun moveAudio(
                  fromIndex: Int,
                  toIndex: Int
              ) {

                  if (_isProcessing.value) {
                      return
                  }

                  val list =
                      _audioQueue.value
                          .toMutableList()

                  if (
                      fromIndex !in list.indices ||
                      toIndex !in list.indices
                  ) {
                      return
                  }

                  val item =
                      list.removeAt(
                          fromIndex
                      )

                  list.add(
                      toIndex,
                      item
                  )

                  _audioQueue.value =
                      list
              }

              fun clearQueue() {

                  if (_isProcessing.value) {
                      return
                  }

                  _audioQueue.value
                      .forEach {
                          it.file.delete()
                      }

                  _audioQueue.value =
                      emptyList()

                  _errorMessage.value =
                      null

                  _errorDetails.value =
                      null

                  _progress.value =
                      null

                  _lastMode.value =
                      null
              }

              fun dismissError() {
                  _errorMessage.value = null
              }

              fun dismissErrorDetails() {
                  _errorDetails.value = null
              }

              fun processMerge(
                  onComplete: (File?) -> Unit
              ) {

                  if (
                      _isProcessing.value ||
                      _audioQueue.value.isEmpty()
                  ) {
                      return
                  }

                  viewModelScope.launch {

                      _isProcessing.value =
                          true

                      _progress.value =
                          0f

                      _processedMs.value =
                          0L

                      _totalMs.value =
                          null

                      _phase.value =
                          "Preparando..."

                      _lastMode.value =
                          null

                      _errorDetails.value =
                          null

                      try {

                          val result =
                              AudioMerger.mergeAudios(
                                  getApplication(),
                                  _audioQueue.value
                              ) {
                                  progress,
                                  processed,
                                  total,
                                  phase ->

                                  _progress.value =
                                      progress

                                  _processedMs.value =
                                      processed

                                  _totalMs.value =
                                      total

                                  _phase.value =
                                      phase
                              }

                          if (
                              result.file != null
                          ) {

                              _progress.value =
                                  1f

                              _phase.value =
                                  "Concluído"

                              _lastMode.value =
                                  result.mode

                              onComplete(
                                  result.file
                              )

                          } else {

                              _errorDetails.value =
                                  result.error
                                      ?: "Falha desconhecida."
                          }

                      } catch (e: Throwable) {

                          _errorDetails.value =
                              """
                              O aplicativo encontrou um erro.

                              Tipo:
                              ${e.javaClass.simpleName}

                              Mensagem:
                              ${e.message ?: "Sem detalhes."}
                              """.trimIndent()

                      } finally {

                          _isProcessing.value =
                              false
                      }
                  }
              }
          }
